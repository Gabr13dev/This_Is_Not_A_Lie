  <script>
    // O texto é desenhado espelhado num canvas: não dá pra copiar nem ler no código-fonte.
    (function () {
      const NOTA = "?sona 005 ed siam áh irros euq rehlum a emrod ednO";
      const texto = Array.from(NOTA).reverse().join("");
      const canvas = document.getElementById("espelhado");
      const ctx = canvas.getContext("2d");
      const FONTE = 'italic 30px "IM Fell English", Georgia, serif';

      function quebrarLinhas(largura) {
        const palavras = texto.split(" ");
        const linhas = [];
        let atual = "";
        for (const p of palavras) {
          const teste = atual ? atual + " " + p : p;
          if (ctx.measureText(teste).width > largura && atual) { linhas.push(atual); atual = p; }
          else atual = teste;
        }
        if (atual) linhas.push(atual);
        return linhas;
      }

      function desenhar() {
        const dpr = window.devicePixelRatio || 1;
        const largura = canvas.clientWidth;
        ctx.font = FONTE;
        const linhas = quebrarLinhas(largura - 16);
        const alturaLinha = 42;
        const altura = linhas.length * alturaLinha + 16;
        canvas.style.height = altura + "px";
        canvas.width = largura * dpr;
        canvas.height = altura * dpr;
        ctx.setTransform(-dpr, 0, 0, dpr, largura * dpr, 0); // espelha na horizontal
        ctx.font = FONTE;
        ctx.fillStyle = "#5b3a1c";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        linhas.forEach((l, i) => ctx.fillText(l, largura / 2, 8 + alturaLinha * (i + 0.5)));
      }

      document.fonts.load(FONTE).finally(desenhar);
      window.addEventListener("resize", desenhar);
    })();
  </script>
