<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pontos e traços</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/temas/telegrafo.css">
  <script src="../js/arg.js"></script>
</head>
<body data-fase="8" class="tema-telegrafo">
  <main>
    <div class="fase-num">FASE VIII</div>
    <h1 class="titulo">Pontos e traços</h1>

    <p class="dica digitar">Antes das máquinas, os segredos viajavam por fios. Um pintor americano inventou uma linguagem feita só de pontos e traços. Meu próximo destino está escrito nela:</p>

    <div class="aparelho">
      <div class="lampada" id="lampada" aria-hidden="true"></div>

      <div class="fita-janela" id="fita-janela">
        <canvas id="fita" aria-label="Fita de papel do telégrafo"></canvas>
      </div>

      <svg class="chave" id="chave" viewBox="0 0 120 70" xmlns="http://www.w3.org/2000/svg" role="button" aria-label="Chave do telégrafo">
        <rect x="2" y="48" width="116" height="18" rx="3" fill="#3a2414"/>
        <rect x="8" y="52" width="104" height="9" rx="1.5" fill="#b8924c" stroke="#8a6a30" stroke-width="1"/>
        <text x="103" y="59.2" font-family="Georgia, serif" font-size="6.5" fill="#9c7a3c">I</text>
        <rect x="13" y="36" width="10" height="16" rx="2" fill="#a07d3c"/>
        <rect x="86" y="44" width="8" height="8" rx="1.5" fill="#a07d3c"/>
        <g class="alavanca">
          <rect x="14" y="40" width="90" height="5" rx="2" fill="#d4af63" stroke="#8a6a30" stroke-width=".8"/>
          <ellipse cx="102" cy="35" rx="11" ry="7" fill="#1d1a17"/>
          <rect x="99" y="39" width="6" height="4" fill="#1d1a17"/>
        </g>
        <circle cx="18" cy="42.5" r="2.4" fill="#6e5426"/>
      </svg>
    </div>

    <div class="controles">
      <button type="button" id="tocar">▶ receber transmissão</button>
      <small>dá pra apertar a chave também</small>
    </div>
    <audio id="audio" src="../audio/transmissao.wav" preload="auto"></audio>

    <form id="form-resposta" autocomplete="off">
      <input type="text" placeholder="resposta" aria-label="Resposta">
      <button type="submit">ENVIAR</button>
    </form>
    <p id="mensagem" class="mensagem"></p>

    <p class="dica-extra" data-erros="3" hidden>O inventor se chamava Samuel. O sobrenome dele é o nome do código.</p>
  </main>

  <script>
    (function () {
      const audio = document.getElementById("audio");
      const lampada = document.getElementById("lampada");
      const canvas = document.getElementById("fita");
      const janela = document.getElementById("fita-janela");
      const ctx = canvas.getContext("2d");
      const PX_POR_SEG = 70;
      // Momentos (em segundos) em que o som está ligado na transmissão
      const BIPES = [[0.005,0.225],[1.235,1.3],[2.305,2.375],[2.46,2.68],[2.765,2.835],[2.92,2.985],[3.995,4.06],[5.07,5.135],[5.225,5.29],[5.375,5.595],[5.685,5.75],[6.755,6.975],[7.065,7.285],[7.37,7.59],[8.6,8.82],[8.905,8.97],[9.98,10.045]];
      let desenhando = false;

      function prepararFita() {
        const dur = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : 11;
        const dpr = window.devicePixelRatio || 1;
        const largura = Math.ceil(dur * PX_POR_SEG) + 40;
        canvas.style.width = largura + "px";
        canvas.width = largura * dpr;
        canvas.height = 40 * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, largura, 40);
        janela.scrollLeft = 0;
      }
      audio.addEventListener("loadedmetadata", prepararFita);
      prepararFita();

      // Marca na fita tudo que já tocou até o tempo t (como o telégrafo do Morse fazia)
      function marcarAte(t) {
        ctx.fillStyle = "#2a2018";
        for (const [ini, fim] of BIPES) {
          if (ini > t) break;
          const x1 = 20 + ini * PX_POR_SEG;
          const x2 = 20 + Math.min(fim, t) * PX_POR_SEG;
          ctx.fillRect(x1, 17, Math.max(2, x2 - x1), 6);
        }
      }

      function quadro() {
        if (!desenhando) return;
        const t = audio.currentTime;
        const ligado = BIPES.some(([ini, fim]) => t >= ini && t <= fim);
        lampada.classList.toggle("acesa", ligado);
        marcarAte(t);
        const alvo = 20 + t * PX_POR_SEG - janela.clientWidth * 0.6;
        if (alvo > janela.scrollLeft) janela.scrollLeft = alvo;
        requestAnimationFrame(quadro);
      }

      const botao = document.getElementById("tocar");
      botao.addEventListener("click", () => {
        prepararFita();
        audio.currentTime = 0;
        const tocando = audio.play();
        if (tocando && tocando.catch) {
          tocando.catch(() => { botao.textContent = "▶ tentar de novo"; });
        }
        desenhando = true;
        requestAnimationFrame(quadro);
      });
      audio.addEventListener("ended", () => {
        desenhando = false;
        lampada.classList.remove("acesa");
        marcarAte(Infinity);
      });

      // A chave: aperte para fazer seu próprio bip
      const chave = document.getElementById("chave");
      let ctxAudio, osc;
      function apertar(e) {
        e.preventDefault();
        try {
          ctxAudio = ctxAudio || new (window.AudioContext || window.webkitAudioContext)();
          if (ctxAudio.state === "suspended") ctxAudio.resume();
          osc = ctxAudio.createOscillator();
          const ganho = ctxAudio.createGain();
          osc.frequency.value = 650;
          ganho.gain.value = 0.15;
          osc.connect(ganho).connect(ctxAudio.destination);
          osc.start();
        } catch (erro) { osc = null; }
        chave.classList.add("apertada");
        lampada.classList.add("acesa");
      }
      function soltar() {
        if (osc) { osc.stop(); osc = null; }
        chave.classList.remove("apertada");
        if (!desenhando) lampada.classList.remove("acesa");
      }
      chave.addEventListener("pointerdown", apertar);
      ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => chave.addEventListener(ev, soltar));
    })();
  </script>
</body>
</html>
